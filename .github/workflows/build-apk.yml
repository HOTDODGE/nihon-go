name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build NihonGo APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. 저장소 소스코드 가져오기
        uses: actions/checkout@v4

      - name: 2. Node.js 환경 설정
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 3. Java (JDK 17) 환경 설정
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Android SDK 35 및 빌드 도구 설정
        uses: android-actions/setup-android@v3

      - name: 5. 프로젝트 의존성 패키지 설치
        run: npm install

      - name: 6. 최신 웹 애플리케이션 컴파일
        run: npm run build

      - name: 7. Capacitor 안드로이드 프로젝트 동기화
        run: npx cap sync android

      - name: 8. Gradle 실행 파일 줄바꿈(CRLF) 보정 및 권한 부여
        run: |
          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew

      - name: 9. 안드로이드 APK 컴파일
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 10. 완성된 APK 파일 준비
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/NihonGo.apk

      - name: 11. APK 다운로드 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: NihonGo-APK
          path: output/NihonGo.apk
          retention-days: 30
